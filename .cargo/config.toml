[target.xtensa-esp32-none-elf]
runner = "espflash --monitor"
rustflags = [
  "-C",
  "link-arg=-Tlinkall.x",

  "-C",
  "link-arg=-nostartfiles",

  # defmt linking options
  # "-C",
  # "link-arg=-Tdefmt.x",
]

[build]
target = "xtensa-esp32-none-elf"

[unstable]
build-std = ["core"]

[env]
ESP_HAL_CONFIG_MIN_CHIP_REVISION = "100"
